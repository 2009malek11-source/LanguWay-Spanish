<style>
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#F5E6B3;font-family:Georgia,"Times New Roman",serif;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash .ov{width:min(82vw,420px);aspect-ratio:1.28;border-radius:50%;background:#FFFEF8;box-shadow:0 0 0 3px #000,0 0 0 5px #C9A227,0 0 60px rgba(201,162,39,.35);display:flex;align-items:center;justify-content:center;animation:spl-in 1.1s ease both}
#splash img{width:62%;height:auto}
#splash p{margin:26px 0 0;font-style:italic;letter-spacing:.06em;font-size:1.05rem;animation:spl-in 1.3s .4s ease both}
#splash i{display:block;margin-top:16px;width:min(40vw,150px);height:2px;background:rgba(245,230,179,.25);overflow:hidden}
#splash i:after{content:"";display:block;height:100%;background:#C9A227;transform-origin:left;animation:spl-bar 2.6s .2s linear both}
@keyframes spl-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spl-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash .ov,#splash p,#splash i:after{animation:none}}
</style>
</head>

<div id="splash" role="status" aria-label="Languway Spanish"><div class="ov"><img src="logo.png" alt="" width="240" height="225"></div><p>Aprende español en español</p><i></i></div>
